<svg viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <title>Backend &amp; Database Developer Profile Banner</title>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="55%" stop-color="#0D1524"/>
      <stop offset="100%" stop-color="#111C30"/>
    </linearGradient>

    <pattern id="gridPattern" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.05"/>
    </pattern>

    <radialGradient id="dbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <!-- connecting line paths, defined once, reused for stroke + motion -->
    <path id="lineAPI"    d="M 1010,150 L 1145,215" />
    <path id="lineCache"  d="M 1010,350 L 1145,285" />
    <path id="lineQueue"  d="M 1350,150 L 1215,215" />
    <path id="lineClient" d="M 1350,350 L 1215,285" />
  </defs>

  <!-- outer frame -->
  <rect x="1.5" y="1.5" width="1497" height="497" rx="24" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="1.5" y="1.5" width="1497" height="497" rx="24" fill="url(#gridPattern)"/>

  <!-- ================= LEFT: code panel ================= -->
  <g font-family="'Fira Code','JetBrains Mono',Consolas,monospace">
    <!-- terminal body -->
    <rect x="50" y="90" width="650" height="320" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <!-- header bar -->
    <rect x="50" y="90" width="650" height="44" rx="16" fill="#0B1220"/>
    <rect x="50" y="118" width="650" height="16" fill="#0B1220"/>
    <rect x="50" y="133.5" width="650" height="1" fill="#1E293B"/>

    <text x="78" y="119" font-size="16" fill="#64748B">profile.js</text>

    <!-- code content -->
    <g font-size="26">
      <text x="80" y="182" fill="#94A3B8">const <tspan fill="#E2E8F0">developer</tspan> = {</text>

      <text x="105" y="226"><tspan fill="#5EEAD4">role</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#FBBF24">"Backend Engineer"</tspan><tspan fill="#94A3B8">,</tspan></text>

      <text x="105" y="270"><tspan fill="#5EEAD4">focus</tspan><tspan fill="#94A3B8">: [</tspan><tspan fill="#FBBF24">"APIs"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#FBBF24">"Databases"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#FBBF24">"Security"</tspan><tspan fill="#94A3B8">],</tspan></text>

      <text x="105" y="314"><tspan fill="#5EEAD4">status</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#FBBF24">"always shipping"</tspan></text>

      <text x="80" y="358" fill="#94A3B8">};</text>
      <rect x="120" y="342" width="14" height="26" fill="#5EEAD4">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- ================= RIGHT: distributed system diagram ================= -->
  <g>
    <!-- connecting lines -->
    <use xlink:href="#lineAPI" stroke="#1E293B" stroke-width="2.5" fill="none"/>
    <use xlink:href="#lineCache" stroke="#1E293B" stroke-width="2.5" fill="none"/>
    <use xlink:href="#lineQueue" stroke="#1E293B" stroke-width="2.5" fill="none"/>
    <use xlink:href="#lineClient" stroke="#1E293B" stroke-width="2.5" fill="none"/>

    <!-- traveling data particles -->
    <circle r="5" fill="#FBBF24">
      <animateMotion dur="2.6s" repeatCount="indefinite" rotate="auto">
        <mpath xlink:href="#lineAPI"/>
      </animateMotion>
    </circle>
    <circle r="5" fill="#A78BFA">
      <animateMotion dur="3.1s" begin="0.6s" repeatCount="indefinite" rotate="auto">
        <mpath xlink:href="#lineCache"/>
      </animateMotion>
    </circle>
    <circle r="5" fill="#34D399">
      <animateMotion dur="2.8s" begin="1.1s" repeatCount="indefinite" rotate="auto">
        <mpath xlink:href="#lineQueue"/>
      </animateMotion>
    </circle>
    <circle r="5" fill="#5EEAD4">
      <animateMotion dur="3.4s" begin="0.3s" repeatCount="indefinite" rotate="auto">
        <mpath xlink:href="#lineClient"/>
      </animateMotion>
    </circle>

    <!-- central database node -->
    <circle cx="1180" cy="250" r="90" fill="url(#dbGlow)"/>

    <circle cx="1180" cy="248" r="18" fill="none" stroke="#22D3EE" stroke-width="2.5" opacity="0.7">
      <animate attributeName="r" values="18;85" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1180" cy="248" r="18" fill="none" stroke="#22D3EE" stroke-width="2.5" opacity="0.7">
      <animate attributeName="r" values="18;85" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
    </circle>

    <!-- db cylinder -->
    <g>
      <path d="M 1130,290 A 50,16 0 0 0 1230,290 L 1230,210 A 50,16 0 0 0 1130,210 Z" fill="#0F172A" stroke="#22D3EE" stroke-width="2.5"/>
      <ellipse cx="1180" cy="210" rx="50" ry="16" fill="#0F172A" stroke="#22D3EE" stroke-width="2.5"/>
      <ellipse cx="1180" cy="250" rx="50" ry="14" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.4"/>
    </g>
    <text x="1180" y="332" text-anchor="middle" font-family="'Fira Code',monospace" font-size="16" fill="#64748B">database</text>

    <!-- satellite nodes -->
    <g font-family="'Fira Code',monospace" font-size="15" fill="#94A3B8" text-anchor="middle">
      <g>
        <circle cx="1005" cy="150" r="30" fill="#0F172A" stroke="#A78BFA" stroke-width="2">
          <animate attributeName="opacity" values="0.75;1;0.75" dur="3.2s" repeatCount="indefinite"/>
        </circle>
        <text x="1005" y="156">API</text>
      </g>
      <g>
        <circle cx="1005" cy="350" r="30" fill="#0F172A" stroke="#34D399" stroke-width="2">
          <animate attributeName="opacity" values="0.75;1;0.75" dur="2.7s" begin="0.4s" repeatCount="indefinite"/>
        </circle>
        <text x="1005" y="356">cache</text>
      </g>
      <g>
        <circle cx="1355" cy="150" r="30" fill="#0F172A" stroke="#FBBF24" stroke-width="2">
          <animate attributeName="opacity" values="0.75;1;0.75" dur="3.5s" begin="0.9s" repeatCount="indefinite"/>
        </circle>
        <text x="1355" y="156">queue</text>
      </g>
      <g>
        <circle cx="1355" cy="350" r="30" fill="#0F172A" stroke="#5EEAD4" stroke-width="2">
          <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" begin="1.4s" repeatCount="indefinite"/>
        </circle>
        <text x="1355" y="356">client</text>
      </g>
    </g>
  </g>
</svg>
