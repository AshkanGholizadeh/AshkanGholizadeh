<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="btitle bdesc" preserveAspectRatio="xMidYMid meet" font-family="'Space Grotesk','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">
  <title id="btitle">Ashkan Gholizadeh: Backend Developer, Database Engineer, Security-minded</title>
  <desc id="bdesc">Animated dark-slate terminal banner with an amber shield HUD. A shell prompt is answered by the name Ashkan Gholizadeh in an amber-to-orange gradient, a role line types itself out behind a block cursor, status pills fade in, and a shield icon runs a repeating vertical security scan behind a faint hex/binary backdrop.</desc>

  <defs>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="400" rx="18" ry="18"/>
    </clipPath>

    <clipPath id="typeClip">
      <rect class="typeMask" x="70" y="224" width="571" height="30"/>
    </clipPath>

    <clipPath id="shieldClip">
      <path d="M0,-58 L48,-38 L48,10 C48,42 26,60 0,72 C-26,60 -48,42 -48,10 L-48,-38 Z"/>
    </clipPath>

    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop class="s0" offset="0" stop-color="#fbbf24"/>
      <stop class="s1" offset="0.5" stop-color="#fb923c"/>
      <stop class="s2" offset="1" stop-color="#f97316"/>
    </linearGradient>

    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2530"/>
      <stop offset="1" stop-color="#141822"/>
    </linearGradient>

    <linearGradient id="shieldStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>

    <linearGradient id="scanFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowSlate" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34,0 L0,0 0,34" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <style>
      .mono { font-family: 'JetBrains Mono','SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace; }

      .eyebrow  { opacity: 0; animation: fadeUp 0.7s ease-out 0.2s forwards; }
      .name-in  { opacity: 0; animation: fadeIn 0.9s ease-out 0.5s forwards; }
      .status-in{ opacity: 0; animation: fadeUp 0.7s ease-out 4.0s forwards; }
      .pulseDot { transform-box: fill-box; transform-origin: center; animation: statusPulse 2s ease-in-out infinite; }

      .typeMask {
        transform-box: fill-box;
        transform-origin: left center;
        animation: type 2.7s steps(53) 1.1s both;
      }
      .caret {
        animation: caret 2.7s steps(53) 1.1s both, blink 1.05s steps(1) 3.8s infinite;
      }

      .s0 { animation: hue 6s linear infinite; }
      .s1 { animation: hue 6s linear infinite -2s; }
      .s2 { animation: hue 6s linear infinite -4s; }

      .scanline { animation: scan 3.2s ease-in-out infinite; }
      .keyPulse { transform-box: fill-box; transform-origin: center; animation: statusPulse 2.6s ease-in-out infinite; }
      .badge    { transform-box: fill-box; transform-origin: center; animation: badgeIn 0.6s ease-out 3.6s both; }

      .orb1 { animation: drift1 26s ease-in-out infinite; }
      .orb2 { animation: drift2 31s ease-in-out infinite; }

      @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes blink  { 0%,48% { opacity: 1; } 49%,100% { opacity: 0; } }
      @keyframes type   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes caret  { from { transform: translateX(0); } to { transform: translateX(571px); } }
      @keyframes statusPulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(1.3); } }
      @keyframes hue { 0% { stop-color: #fbbf24; } 33% { stop-color: #fb923c; } 66% { stop-color: #f97316; } 100% { stop-color: #fbbf24; } }
      @keyframes scan { 0% { transform: translateY(-72px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateY(72px); opacity: 0; } }
      @keyframes badgeIn { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
      @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-20px,14px); } }
      @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(18px,-12px); } }

      @media (prefers-reduced-motion: reduce) {
        .eyebrow,.name-in,.status-in { opacity: 1; animation: none; }
        .typeMask { animation: none; }
        .caret { animation: none; transform: translateX(571px); }
        .pulseDot,.keyPulse,.orb1,.orb2,.s0,.s1,.s2,.scanline { animation: none; }
        .badge { opacity: 1; transform: scale(1); animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="1200" height="400" fill="#0c0e13"/>
    <rect x="0" y="0" width="1200" height="400" fill="url(#grid)"/>
    <g opacity="0.9">
      <circle class="orb1" cx="960" cy="80"  r="230" fill="url(#glowAmber)"/>
      <circle class="orb2" cx="1060" cy="340" r="200" fill="url(#glowSlate)"/>
    </g>

    <!-- Shield / security HUD -->
    <g transform="translate(970,206)">
      <path d="M0,-58 L48,-38 L48,10 C48,42 26,60 0,72 C-26,60 -48,42 -48,10 L-48,-38 Z"
            fill="url(#shieldFill)" stroke="url(#shieldStroke)" stroke-width="2"/>
      <g clip-path="url(#shieldClip)">
        <rect class="scanline" x="-60" y="-16" width="120" height="16" fill="url(#scanFade)"/>
      </g>
      <path d="M-16,4 L-6,16 L20,-14" fill="none" stroke="#fbbf24" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>
      <circle class="keyPulse" cx="0" cy="-58" r="4" fill="#fbbf24"/>
    </g>

    <!-- Title bar -->
    <g>
      <circle cx="30" cy="26" r="6" fill="#ff5f57"/>
      <circle cx="52" cy="26" r="6" fill="#febc2e"/>
      <circle cx="74" cy="26" r="6" fill="#28c840"/>
      <text class="mono" x="104" y="31" font-size="14" fill="#ffffff" fill-opacity="0.32">ashkan@core: ~/backend --secure</text>
      <line x1="0" y1="52" x2="1200" y2="52" stroke="#ffffff" stroke-opacity="0.07"/>
    </g>

    <text class="mono eyebrow" x="70" y="128" font-size="16" fill="#fbbf24" fill-opacity="0.95">$ whoami</text>

    <g class="name-in">
      <text x="68" y="196" font-size="60" font-weight="800" letter-spacing="0.5" fill="url(#brand)">Ashkan Gholizadeh</text>
    </g>

    <g clip-path="url(#typeClip)">
      <text class="mono" x="70" y="246" font-size="18" textLength="571" lengthAdjust="spacing" fill="#ffffff" fill-opacity="0.82">Backend Developer &#183; Database Engineer &#183; Security-minded</text>
    </g>
    <rect class="caret" x="70" y="230" width="9" height="20" fill="#fbbf24"/>

    <g class="status-in">
      <rect x="70" y="292" width="236" height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle class="pulseDot" cx="92" cy="309" r="5" fill="#22c55e"/>
      <text class="mono" x="106" y="314" font-size="13.5" fill="#ffffff" fill-opacity="0.78">Open to opportunities</text>

      <rect x="318" y="292" width="272" height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle cx="340" cy="309" r="5" fill="#fbbf24"/>
      <text class="mono" x="354" y="314" font-size="13.5" fill="#ffffff" fill-opacity="0.78">Backend &amp; Database Focus</text>

      <g class="badge" transform="translate(660,309)">
        <path d="M0,-14 L12,-9 L12,3 C12,11 6,15 0,18 C-6,15 -12,11 -12,3 L-12,-9 Z"
              fill="none" stroke="#fbbf24" stroke-width="1.6" opacity="0.85"/>
      </g>
    </g>

    <rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="17.5" ry="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
  </g>
</svg>
