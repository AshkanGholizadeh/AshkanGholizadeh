<svg viewBox="0 0 1500 300" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <title>Backend &amp; Database Developer Profile Banner</title>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="55%" stop-color="#0D1524"/>
      <stop offset="100%" stop-color="#111C30"/>
    </linearGradient>

    <pattern id="gridPattern" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.05"/>
    </pattern>

    <radialGradient id="dbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <!-- connecting line paths, defined once, reused for stroke + motion -->
    <path id="lineAPI"   d="M 1005,95  L 1170,140" />
    <path id="lineCache" d="M 1005,205 L 1170,160" />
    <path id="lineQueue" d="M 1355,95  L 1190,140" />
    <path id="lineClient" d="M 1355,205 L 1190,160" />
  </defs>

  <!-- outer frame -->
  <rect x="1.5" y="1.5" width="1497" height="297" rx="20" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="1.5" y="1.5" width="1497" height="297" rx="20" fill="url(#gridPattern)"/>

  <!-- ================= LEFT: code panel ================= -->
  <g font-family="'Fira Code','JetBrains Mono',Consolas,monospace">
    <!-- terminal body -->
    <rect x="50" y="55" width="580" height="190" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <!-- header bar -->
    <rect x="50" y="55" width="580" height="34" rx="14" fill="#0B1220"/>
    <rect x="50" y="75" width="580" height="14" fill="#0B1220"/>
    <rect x="50" y="88.5" width="580" height="1" fill="#1E293B"/>

    <circle cx="76" cy="72" r="6" fill="#EF4444" opacity="0.85"/>
    <circle cx="96" cy="72" r="6" fill="#FBBF24" opacity="0.85"/>
    <circle cx="116" cy="72" r="6" fill="#34D399" opacity="0.85"/>
    <text x="142" y="76" font-size="12.5" fill="#64748B">profile.js</text>

    <!-- code content -->
    <g font-size="18">
      <text x="75" y="117" fill="#94A3B8">const <tspan fill="#E2E8F0">developer</tspan> = {</text>

      <text x="95" y="147"><tspan fill="#5EEAD4">role</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#FBBF24">"Backend Engineer"</tspan><tspan fill="#94A3B8">,</tspan></text>

      <text x="95" y="177"><tspan fill="#5EEAD4">focus</tspan><tspan fill="#94A3B8">: [</tspan><tspan fill="#FBBF24">"APIs"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#FBBF24">"Databases"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#FBBF24">"Systems"</tspan><tspan fill="#94A3B8">],</tspan></text>

      <text x="95" y="207"><tspan fill="#5EEAD4">status</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#FBBF24">"always shipping"</tspan></text>

      <text x="75" y="233" fill="#94A3B8">};</text>
      <rect x="107" y="219" width="10" height="18" fill="#5EEAD4">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- ================= RIGHT: distributed system diagram ================= -->
  <g>
    <!-- connecting lines -->
    <use xlink:href="#lineAPI" stroke="#1E293B" stroke-width="2" fill="none"/>
    <use xlink:href="#lineCache" stroke="#1E293B" stroke-width="2" fill="none"/>
    <use xlink:href="#lineQueue" stroke="#1E293B" stroke-width="2" fill="none"/>
    <use xlink:href="#lineClient" stroke="#1E293B" stroke-width="2" fill="none"/>

    <!-- traveling data particles -->
    <circle r="4" fill="#FBBF24">
      <animateMotion dur="2.6s" repeatCount="indefinite" rotate="auto">
        <mpath xlink:href="#lineAPI"/>
      </animateMotion>
    </circle>
    <circle r="4" fill="#A78BFA">
      <animateMotion dur="3.1s" begin="0.6s" repeatCount="indefinite" rotate="auto">
        <mpath xlink:href="#lineCache"/>
      </animateMotion>
    </circle>
    <circle r="4" fill="#34D399">
      <animateMotion dur="2.8s" begin="1.1s" repeatCount="indefinite" rotate="auto">
        <mpath xlink:href="#lineQueue"/>
      </animateMotion>
    </circle>
    <circle r="4" fill="#5EEAD4">
      <animateMotion dur="3.4s" begin="0.3s" repeatCount="indefinite" rotate="auto">
        <mpath xlink:href="#lineClient"/>
      </animateMotion>
    </circle>

    <!-- central database node -->
    <circle cx="1180" cy="150" r="70" fill="url(#dbGlow)"/>

    <circle cx="1180" cy="145" r="14" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.7">
      <animate attributeName="r" values="14;65" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1180" cy="145" r="14" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.7">
      <animate attributeName="r" values="14;65" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
    </circle>

    <!-- db cylinder -->
    <g>
      <path d="M 1135,180 A 45,14 0 0 0 1225,180 L 1225,110 A 45,14 0 0 0 1135,110 Z" fill="#0F172A" stroke="#22D3EE" stroke-width="2"/>
      <ellipse cx="1180" cy="110" rx="45" ry="14" fill="#0F172A" stroke="#22D3EE" stroke-width="2"/>
      <ellipse cx="1180" cy="145" rx="45" ry="12" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.4"/>
    </g>
    <text x="1180" y="215" text-anchor="middle" font-family="'Fira Code',monospace" font-size="12" fill="#64748B">database</text>

    <!-- satellite nodes -->
    <g font-family="'Fira Code',monospace" font-size="11" fill="#94A3B8" text-anchor="middle">
      <g>
        <circle cx="1005" cy="95" r="24" fill="#0F172A" stroke="#A78BFA" stroke-width="1.5">
          <animate attributeName="opacity" values="0.75;1;0.75" dur="3.2s" repeatCount="indefinite"/>
        </circle>
        <text x="1005" y="99">API</text>
      </g>
      <g>
        <circle cx="1005" cy="205" r="24" fill="#0F172A" stroke="#34D399" stroke-width="1.5">
          <animate attributeName="opacity" values="0.75;1;0.75" dur="2.7s" begin="0.4s" repeatCount="indefinite"/>
        </circle>
        <text x="1005" y="209">cache</text>
      </g>
      <g>
        <circle cx="1355" cy="95" r="24" fill="#0F172A" stroke="#FBBF24" stroke-width="1.5">
          <animate attributeName="opacity" values="0.75;1;0.75" dur="3.5s" begin="0.9s" repeatCount="indefinite"/>
        </circle>
        <text x="1355" y="99">queue</text>
      </g>
      <g>
        <circle cx="1355" cy="205" r="24" fill="#0F172A" stroke="#5EEAD4" stroke-width="1.5">
          <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" begin="1.4s" repeatCount="indefinite"/>
        </circle>
        <text x="1355" y="209">client</text>
      </g>
    </g>
  </g>
</svg>
