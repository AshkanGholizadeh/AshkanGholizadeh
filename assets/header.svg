<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #050505; rx: 8px; stroke: #1a1a1a; stroke-width: 1;}
      .glow { filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.6)); }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 32px; fill: #ffffff; font-weight: 800; letter-spacing: -0.5px; }
      .subtitle { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 14px; fill: #a1a1aa; letter-spacing: 1px; text-transform: uppercase; }
      .badge-bg { fill: #111111; stroke: #222222; rx: 4; }
      .badge-text { font-family: ui-monospace, monospace; font-size: 12px; fill: #6366F1; font-weight: bold; }
      .badge-text-sec { font-family: ui-monospace, monospace; font-size: 12px; fill: #10B981; font-weight: bold; }
    </style>
  </defs>
  
  <rect width="100%" height="100%" class="bg" />
  
  <!-- Abstract Padlock Graphic -->
  <g transform="translate(680, 100)" class="glow">
    <circle cx="0" cy="0" r="45" stroke="#111111" stroke-width="4" fill="none"/>
    <path d="M -15 5 L 15 5 L 15 25 L -15 25 Z" fill="#6366F1"/>
    <path d="M -8 5 L -8 -5 C -8 -10, 8 -10, 8 -5 L 8 5" stroke="#6366F1" stroke-width="3" fill="none"/>
    <circle cx="0" cy="15" r="3" fill="#050505"/>
  </g>
  
  <text x="40" y="85" class="title">Full-Stack &amp; Security Engineer</text>
  <text x="40" y="115" class="subtitle">Architecting resilient systems at Hiprax</text>
  
  <!-- Role Badges -->
  <rect x="40" y="135" width="85" height="26" class="badge-bg" />
  <text x="52" y="152" class="badge-text">BACKEND</text>
  
  <rect x="135" y="135" width="90" height="26" class="badge-bg" />
  <text x="147" y="152" class="badge-text-sec">SECURITY</text>
  
  <rect x="235" y="135" width="95" height="26" class="badge-bg" />
  <text x="247" y="152" class="badge-text">FRONTEND</text>
</svg>
